<text x='342' y='602' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328'>I2S audio</text>
<line x1='419' y1='598' x2='447' y2='598' stroke='#1a7f37' stroke-width='2.5'/>
<text x='453' y='602' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328'>UART (wand cable)</text>
<text x='30' y='628' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#57606a'>Coloured tags are power connections: 5V = regulated 5V supply, 3V3 = the board's 3.3V pin, GND = common ground.</text>
<text x='30' y='646' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#57606a'>Every ground is joined. Pixels and the amp should take 5V straight from the supply, not through the controller board.</text>
<text x='30' y='664' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#57606a'>The data-line resistors are recommended, as is a 500-1000 uF capacitor across the ring's power input.</text>
<text x='30' y='682' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#57606a'>Ground the amp's SD (shutdown) pin to mute it during uploads. GPIO35 is input-only.</text>
</svg>
