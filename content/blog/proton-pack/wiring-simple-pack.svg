<text x='342' y='742' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328'>I2S audio</text>
<line x1='419' y1='738' x2='447' y2='738' stroke='#7d5a2c' stroke-width='2.5'/>
<text x='453' y='742' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328'>Switch input</text>
<text x='30' y='768' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#57606a'>Coloured tags are power connections: 5V = regulated 5V supply, 3V3 = the board's 3.3V pin, GND = common ground.</text>
<text x='30' y='786' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#57606a'>Every ground is joined. Pixels and the amp should take 5V straight from the supply, not through the controller board.</text>
<text x='30' y='804' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#57606a'>Wand chain order: 4-pixel bargraph, two body lights, vent, 3-pixel firing strip. Data-line resistors are recommended.</text>
<text x='30' y='822' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#57606a'>Give the ESP32 its own 5V supply or regulator: sharing the amp's feed caused resets while firing.</text>
</svg>
