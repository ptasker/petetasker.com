<text x='502' y='902' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328'>I2C</text>
<text x='30' y='928' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#57606a'>Coloured tags are power connections: 5V = regulated 5V supply, 3V3 = the board's 3.3V pin, GND = common ground.</text>
<text x='30' y='946' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#57606a'>Every ground is joined. Pixels and the amp should take 5V straight from the supply, not through the controller board.</text>
<text x='30' y='964' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#57606a'>Switches connect a GPIO to ground and use the internal pull-ups. The Vent toggle is wired to GPIO1 but</text>
<text x='30' y='982' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#57606a'>the firmware ignores it (VENT_SWITCH_PIN = -1). GPIO2 is a strapping pin: keep fire released at reset.</text>
</svg>
